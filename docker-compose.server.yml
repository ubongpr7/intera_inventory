name: interaims-dev-inventory

x-service: &service
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - platform
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    <<: *service
    restart: "no"
    profiles: ["release"]
    command: ["python", "manage.py", "migrate", "--noinput"]

  web:
    <<: *service
    container_name: interaims-dev-inventory-web
    command: ["sh", "-c", "exec uvicorn core.asgi:application --host 0.0.0.0 --port 7002 --workers $${WEB_CONCURRENCY:-2}"]
    expose:
      - "7002"

  consumer:
    <<: *service
    container_name: interaims-dev-inventory-consumer
    command: ["sh", "-c", "python manage.py consume_kafka"]

  reorder-worker:
    <<: *service
    container_name: interaims-dev-inventory-reorder-worker
    command: ["sh", "-c", "python manage.py evaluate_automated_reorders --interval $${AUTOMATED_REORDER_INTERVAL_SECONDS:-18000}"]

  outbox:
    <<: *service
    container_name: interaims-dev-inventory-outbox
    command: ["sh", "-c", "python manage.py publish_outbox_events"]

  mcp:
    <<: *service
    container_name: interaims-dev-inventory-mcp
    command: ["sh", "-c", "python -m mcp_server.server"]
    expose:
      - "8000"
    depends_on:
      - web

networks:
  platform:
    external: true
    name: interaims-platform

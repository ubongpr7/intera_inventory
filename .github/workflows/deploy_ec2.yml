name: Deploy EC2

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-ec2-${{ github.repository }}-${{ inputs.target_environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: true

env:
  DEPLOY_PATH: /srv/interaims/repositories/${{ github.event.repository.name }}
  COMPOSE_FILE: docker-compose.server.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment || (github.ref_name == 'main' && 'prod' || 'dev') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY || secrets.EC2_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY}" || { echo "An EC2 SSH key is required"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "EC2_HOST is required"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            : > ~/.ssh/known_hosts
            for _ in $(seq 1 30); do
              if ssh-keyscan -T 5 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
                break
              fi
              sleep 5
            done
            test -s ~/.ssh/known_hosts || { echo "SSH host is not ready"; exit 1; }
          fi
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  IdentityFile ~/.ssh/deploy_key' '  IdentitiesOnly yes' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync repository
        env:
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "EC2_USER is required"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "EC2_HOST is required"; exit 1; }
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_opts=(-o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          ssh "${ssh_opts[@]}" "${ssh_target}" "mkdir -p '${{ env.DEPLOY_PATH }}'"
          rsync -az --delete -e "ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10" \
            --exclude='.git' --exclude='.github' --exclude='.venv' \
            --exclude='.env' --exclude='.env.*' --exclude='__pycache__' --exclude='*.pyc' \
            ./ "${ssh_target}:${{ env.DEPLOY_PATH }}/"

      - name: Write environment file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "${ENV_FILE}" || { echo "ENV_FILE is required"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "EC2_USER is required"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "EC2_HOST is required"; exit 1; }
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          printf '%s' "${ENV_FILE}" | ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${ssh_target}" \
            "cat > '${{ env.DEPLOY_PATH }}/.env' && chmod 600 '${{ env.DEPLOY_PATH }}/.env'"

      - name: Deploy with migrations
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "EC2_USER is required"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "EC2_HOST is required"; exit 1; }
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${ssh_target}" \
            "DEPLOY_PATH='${{ env.DEPLOY_PATH }}' COMPOSE_FILE='${{ env.COMPOSE_FILE }}' REPOSITORY_NAME='${REPOSITORY_NAME}' bash -s" <<'REMOTE'
          set -euo pipefail
          flock /tmp/interaims-ec2-deploy.lock bash <<'LOCKED'
          set -euo pipefail
          /usr/local/bin/interaims-host-init
          cd "${DEPLOY_PATH}"
          docker compose -f "${COMPOSE_FILE}" --profile release build
          case "${REPOSITORY_NAME}" in
            kafka_a2a)
              ;;
            subscriptions)
              docker compose -f "${COMPOSE_FILE}" --profile release run --rm migrate
              docker compose -f "${COMPOSE_FILE}" --profile release run --rm release-tasks
              ;;
            *)
              docker compose -f "${COMPOSE_FILE}" --profile release run --rm migrate
              ;;
          esac
          docker compose -f "${COMPOSE_FILE}" up -d --build --force-recreate --remove-orphans
          # Re-resolve Docker service aliases after recreation so Caddy does not retain old container IPs.
          if docker inspect caddy >/dev/null 2>&1; then
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || docker restart caddy
          fi
          docker image prune -f || true
          expected_services=()
          expected_services+=("web")
          expected_services+=("consumer")
          expected_services+=("reorder-worker")
          expected_services+=("outbox")
          expected_services+=("mcp")
          for service in "${expected_services[@]}"; do
            container_id="$(docker compose -f "${COMPOSE_FILE}" ps -aq "${service}")"
            test -n "${container_id}" || { echo "Missing container for ${service}"; docker compose -f "${COMPOSE_FILE}" config --services; docker compose -f "${COMPOSE_FILE}" ps -a; exit 1; }
            state="$(docker inspect -f '{{.State.Status}}' "${container_id}")"
            test "${state}" = running || { echo "Service ${service} is ${state}"; docker compose -f "${COMPOSE_FILE}" ps -a; docker compose -f "${COMPOSE_FILE}" logs --tail=120 "${service}"; exit 1; }
          done
          docker compose -f "${COMPOSE_FILE}" ps
          LOCKED
          REMOTE

      - name: Verify deployment
        env:
          DEPLOY_USER: ${{ secrets.EC2_USER }}
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "EC2_USER is required"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "EC2_HOST is required"; exit 1; }
          ssh_target="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "${ssh_target}" \
            "cd '${{ env.DEPLOY_PATH }}' && \
            for service in web consumer reorder-worker outbox mcp; do \
              cid=\$(docker compose -f '${{ env.COMPOSE_FILE }}' ps -aq \"\${service}\"); \
              test -n \"\${cid}\" || { echo \"Missing container for \${service}\"; docker compose -f '${{ env.COMPOSE_FILE }}' config --services; docker compose -f '${{ env.COMPOSE_FILE }}' ps -a; exit 1; }; \
              state=\$(docker inspect -f '{{.State.Status}}' \"\${cid}\"); \
              test \"\${state}\" = running || { echo \"Service \${service} is \${state}\"; docker compose -f '${{ env.COMPOSE_FILE }}' ps -a; docker compose -f '${{ env.COMPOSE_FILE }}' logs --tail=120 \"\${service}\"; exit 1; }; \
            done; \
            docker compose -f '${{ env.COMPOSE_FILE }}' ps"


